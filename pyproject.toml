[project]
name = "aic-prj-1"
version = "0.1.0"
description = "BookStreet RAG Chatbot using PostgreSQL/pgvector, Ollama/Gemini embeddings, and FastAPI"
readme = "README.md"
authors = [
    { name = "The Hoang", email = "phanthehoang2503@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg>=3.3.8",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
