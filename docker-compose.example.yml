services:
  # Service 1: Database PostgreSQL kèm pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_DB: vectordb
    ports:
      - "5434:5432"
    volumes:
      # Lưu dữ liệu trên máy, xóa container không mất data
      - pgvector_data:/var/lib/postgresql/data
      # Tự động bật sẵn extension vector ngay lần khởi tạo đầu tiên
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d vectordb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: Giao diện quản lý Web Adminer
  adminer:
    image: adminer:latest
    container_name: db-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgvector_data:
