services:
  # Service 1: Database PostgreSQL kèm pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASS:?Set DB_SUPERUSER_PASS in .env}
      POSTGRES_DB: ${DB_NAME:-vectordb}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      # Lưu dữ liệu trên máy, xóa container không mất data
      - pgvector_data:/var/lib/postgresql/data
      # Tự động bật sẵn extension vector ngay lần khởi tạo đầu tiên
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: Giao diện quản lý Web Adminer (chỉ chạy với --profile debug)
  adminer:
    image: adminer:4.8.1
    container_name: db-dashboard
    profiles: ["debug"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgvector_data:
